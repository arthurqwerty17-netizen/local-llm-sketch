name: Build IPA

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: write

# Archives the app, packages an unsigned IPA, uploads it as a build artifact,
# and attaches it to a GitHub Release tagged after the app's marketing version.
#
# The native inference frameworks (llama.xcframework, whisper) are NOT built
# here: they are produced by scripts/build_native_frameworks.sh from submodules
# and are gitignored. This job therefore runs only when the tracked project
# builds without them, and reports clearly when it cannot — see the guard step.

jobs:
  # Always runs. Parses every Swift source with the toolchain the runner already
  # has, so a syntax error fails CI before the archive job is reached. This is a
  # parse, not a type-check: it needs no SDK frameworks and no native xcframeworks.
  syntax:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Parse Swift sources
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            if ! xcrun swiftc -parse "$file" >/tmp/parse.log 2>&1; then
              echo "::error file=$file::$(head -n 5 /tmp/parse.log | tr '\n' ' ')"
              fail=1
            fi
          done < <(find IOSLocalLLM CoreAIOnDeviceLAS -name '*.swift' -not -path '*/Vendor/*')
          exit $fail

  # Archives only when the tracked project and the native inference frameworks
  # are both present. The frameworks are gitignored build outputs, so a fork
  # needs to run scripts/build_native_frameworks.sh on an Apple-silicon Mac once.
  build:
    runs-on: macos-15
    needs: syntax
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Check prerequisites
        id: guard
        run: |
          if [ -d "OnDeviceLAS.xcodeproj" ] \
             && [ -d "ThirdParty/llama.cpp/build-apple/llama.xcframework" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the archive: OnDeviceLAS.xcodeproj or llama.xcframework is missing. Build the frameworks with scripts/build_native_frameworks.sh, then dispatch again."
          fi

      - name: Archive
        if: steps.guard.outputs.ready == 'true'
        run: |
          xcodebuild \
            -project OnDeviceLAS.xcodeproj \
            -scheme OnDeviceLAS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocalLLMSketch.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir -p Payload
          cp -R "build/LocalLLMSketch.xcarchive/Products/Applications/"*.app Payload/
          zip -qry LocalLLMSketch.ipa Payload

      - name: Read app version
        id: version
        if: steps.guard.outputs.ready == 'true'
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleShortVersionString" \
            build/LocalLLMSketch.xcarchive/Products/Applications/*.app/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release channel
        id: channel
        if: steps.guard.outputs.ready == 'true'
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA artifact
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalLLMSketch-ipa${{ steps.channel.outputs.suffix }}
          path: LocalLLMSketch.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub release
        if: steps.guard.outputs.ready == 'true'
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.5.0
        with:
          tag_name: ${{ format('v{0}', steps.version.outputs.version) }}
          name: ${{ format('Local LLM Sketch v{0}', steps.version.outputs.version) }}
          body: Unsigned IPA built from ${{ github.ref_name }}. Re-sign it with your own certificate to install.
          files: LocalLLMSketch.ipa
          fail_on_unmatched_files: true

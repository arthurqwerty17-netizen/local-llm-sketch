<?xml version="1.0" encoding="UTF-8"?>
<!--
  Local LLM Sketch mark — vector source for the app icon and wordmark.

  Mirrors LASLogoMark / LASLogoStroke in the app so the two never drift:
  1024 pt canvas, 0.225 corner radius (rx = 230), artwork inset by 0.235 of the
  side (240.64) into a 542.72 square, stroke width 0.085 of the side (87), and
  the caret dot at 0.215 of the side right of the bottom corner.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Local LLM Sketch">
  <title>Local LLM Sketch</title>
  <defs>
    <linearGradient id="sketch-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#835CF9"/>
      <stop offset="1" stop-color="#672FE6"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#sketch-purple)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="12"/>

  <!-- One continuous gesture: rises, turns over, and falls into a chat tail. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="87"
     stroke-linecap="round" stroke-linejoin="round"
     transform="translate(240.64 240.64) scale(5.4272)">
    <path d="M 3.252 35.280
             C 6.504 8.064 17.356 17.136 24.936 15.120
             C 40.108 11.088 14.096 46.400 27.108 39.312"/>
  </g>

  <!-- Caret dot -->
  <circle cx="732" cy="732" r="54" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>

name: Build IPA

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: write

# Archives the app, packages an unsigned IPA, uploads it as a build artifact,
# and attaches it to a GitHub Release. Everything the archive needs — the pinned
# submodules, the native xcframeworks built from them, the generated Xcode
# project, and the pods — is produced on the runner, so this is the whole build.

jobs:
  # Always runs. Parses every Swift source with the toolchain the runner already
  # has, so a syntax error fails CI before the archive job is reached. This is a
  # parse, not a type-check: it needs no SDK frameworks and no native xcframeworks.
  syntax:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Parse Swift sources
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            if ! xcrun swiftc -parse "$file" >/tmp/parse.log 2>&1; then
              echo "::error file=$file::$(head -n 5 /tmp/parse.log | tr '\n' ' ')"
              fail=1
            fi
          done < <(find IOSLocalLLM CoreAIOnDeviceLAS -name '*.swift' -not -path '*/Vendor/*')
          exit $fail

  # Builds the gitignored native inference frameworks from the pinned
  # submodules, regenerates the Xcode project, archives, and releases an
  # unsigned IPA. This is the only job that produces an installable artifact.
  build:
    runs-on: macos-15
    needs: syntax
    timeout-minutes: 180
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install project tools
        run: |
          brew install xcodegen cocoapods cmake ninja || true
          xcodegen --version
          pod --version

      - name: Build native frameworks
        run: ./scripts/build_native_frameworks.sh --skip-whisper

      - name: Generate the Xcode project
        run: |
          xcodegen generate
          pod install

      - name: List schemes
        run: xcodebuild -workspace OnDeviceLAS.xcworkspace -list

      - name: Archive
        run: |
          xcodebuild \
            -workspace OnDeviceLAS.xcworkspace \
            -scheme OnDeviceLAS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocalLLMSketch.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/LocalLLMSketch.xcarchive/Products/Applications/"*.app Payload/
          zip -qry LocalLLMSketch.ipa Payload
          ls -la LocalLLMSketch.ipa

      - name: Read app version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleShortVersionString" \
            build/LocalLLMSketch.xcarchive/Products/Applications/*.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleVersion" \
            build/LocalLLMSketch.xcarchive/Products/Applications/*.app/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-$BUILD" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalLLMSketch-ipa
          path: LocalLLMSketch.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach IPA to GitHub release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.5.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ format('Local LLM Sketch {0}', steps.version.outputs.tag) }}
          body: |
            Unsigned IPA built from `${{ github.ref_name }}` at ${{ github.sha }}.

            Sideload it with AltStore, SideStore, Sideloadly, or TrollStore.
            The build carries the JIT and increased-memory entitlements, so a
            sideload that preserves entitlements (TrollStore, or a signing
            profile with `get-task-allow`) keeps JIT enabled.
          files: LocalLLMSketch.ipa
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

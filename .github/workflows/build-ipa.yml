name: Build IPA

on:
  push:
    branches: [main, preview]
    # A macOS minute is the most expensive thing in this repository. Documentation
    # and metadata changes do not need the app compiled.
    paths-ignore:
      - "**.md"
      - "Docs/**"
      - "llms.txt"
      - "codemeta.json"
      - "SBOM.spdx.json"
      - "LICENSE"
      - "LICENSES/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image. macos-15 is the oldest live arm64 image, so it is the default; macos-15-intel is the other pool."
        type: choice
        options:
          - macos-15
          - macos-26
          - macos-15-intel
        default: macos-15

permissions:
  contents: write

# Runner images, per actions/runner-images:
#
#   macos-15        arm64, GA, the oldest live arm64 image   <- default
#   macos-15-intel  x64,  GA, the oldest live Intel image
#   macos-26        arm64, GA, newest (macos-latest)
#   xcode-27        arm64, preview
#   macos-14        REMOVED 2026-11-02
#   macos-13        REMOVED earlier, and this workflow targeted it until now
#
# Both "older is safer" defaults of the last two commits were images that no
# longer exist, which is why the build never scheduled: a job asking for a
# retired label is never picked up, however long it waits. Only labels in
# actions/runner-images' README are real; check there before changing this.
#
# The repository is public, so standard runners (macOS included) are free.
#
# One job, ordered cheapest-first so a mistake costs seconds rather than half an
# hour: parse every Swift file, then build the native framework (cached), then
# generate + pod install, then archive.

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 1

      # Pick the newest installed Xcode. Older runner images default to an Xcode
      # that predates the iOS 18 SDK, so choose explicitly and record what the
      # image can actually do.
      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          echo "Available Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)
          sudo xcode-select -s "${latest:-/Applications/Xcode.app}"
          xcodebuild -version
          swift --version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo 0)
          echo "iPhoneOS SDK: $sdk"
          echo "sdk=$sdk" >>"$GITHUB_OUTPUT"
          echo "sdk_major=${sdk%%.*}" >>"$GITHUB_OUTPUT"
          if [ "${sdk%%.*}" -lt 18 ]; then
            echo "::warning::This image ships iOS SDK $sdk, below the project's 18.0 deployment target. The archive will retry with the deployment target lowered to $sdk."
          fi

      # Cheap gate: a syntax error in any Swift file would otherwise only appear
      # after the expensive native build.
      - name: Parse Swift sources
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            if ! xcrun swiftc -parse "$file" >/tmp/parse.log 2>&1; then
              echo "::error file=$file::$(head -n 5 /tmp/parse.log | tr '\n' ' ')"
              fail=1
            fi
          done < <(find IOSLocalLLM CoreAIOnDeviceLAS -name '*.swift' -not -path '*/Vendor/*')
          exit $fail

      - name: Install project tools
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v cmake >/dev/null || brew install cmake
          command -v pod >/dev/null || gem install cocoapods --no-document
          xcodegen --version
          pod --version

      # llama.cpp is a submodule gitlink. If this history has no gitlink for it,
      # clone it so the archive still has the framework it links.
      - name: Ensure llama.cpp sources
        run: |
          set -euo pipefail
          if [ ! -f ThirdParty/llama.cpp/build-xcframework.sh ]; then
            echo "::warning::ThirdParty/llama.cpp absent after checkout; cloning it"
            rm -rf ThirdParty/llama.cpp
            git clone --depth 1 https://github.com/ggml-org/llama.cpp ThirdParty/llama.cpp
          fi

      - name: Derive native framework cache key
        id: native-key
        run: |
          set -euo pipefail
          hash="$(
            {
              git -C ThirdParty/llama.cpp rev-parse HEAD
              git hash-object \
                Patches/llama.cpp-ios-only-xcframework.patch \
                scripts/build_native_frameworks.sh
            } | shasum -a 256 | awk '{ print $1 }'
          )"
          echo "key=native-ios-${{ runner.arch }}-${hash}" >>"$GITHUB_OUTPUT"

      - name: Restore native framework
        id: native-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ThirdParty/llama.cpp/build-apple/llama.xcframework
          key: ${{ steps.native-key.outputs.key }}

      - name: Build llama.cpp XCFramework
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_native_frameworks.sh --skip-whisper

      - name: Generate the Xcode project
        run: |
          xcodegen generate
          pod install

      - name: List schemes
        run: xcodebuild -workspace OnDeviceLAS.xcworkspace -list

      # Older images (macos-13) ship an iOS 17 SDK, and a project whose deployment
      # target is 18.0 cannot be built against it. Rather than give up on the
      # artifact, lower the deployment target to the SDK the image actually has
      # and record that in the release notes. This is a sideload build: it does
      # not have to satisfy an App Store deployment target.
      - name: Archive
        run: |
          set -o pipefail
          sdk_major="${{ steps.xcode.outputs.sdk_major }}"
          target=""
          if [ -n "$sdk_major" ] && [ "$sdk_major" -lt 18 ]; then
            target="IPHONEOS_DEPLOYMENT_TARGET=${sdk_major}.0"
            echo "::warning::Lowering deployment target to ${sdk_major}.0 for this image"
          fi
          xcodebuild \
            -workspace OnDeviceLAS.xcworkspace \
            -scheme OnDeviceLAS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocalLLMSketch.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            $target 2>&1 | tee /tmp/archive.log

      # The step summary is the only place these lines are readable from the
      # chat, so mirror them into the job log as well: a failure nobody can
      # read costs another half-hour run to diagnose.
      - name: Report compiler errors
        if: failure()
        run: |
          {
            echo "### Archive failed"
            echo '```'
            grep -E "error: " /tmp/archive.log | sort -u | head -60 || tail -80 /tmp/archive.log
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/LocalLLMSketch.xcarchive/Products/Applications/*.app Payload/
          zip -qry LocalLLMSketch.ipa Payload
          ls -la LocalLLMSketch.ipa

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          app="$(echo build/LocalLLMSketch.xcarchive/Products/Applications/*.app)"
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Info.plist")
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version-$build" >>"$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalLLMSketch-ipa
          path: LocalLLMSketch.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach IPA to GitHub release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.5.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ format('Local LLM Sketch {0}', steps.version.outputs.tag) }}
          body: |
            Unsigned IPA built from `${{ github.ref_name }}` at `${{ github.sha }}`.

            Sideload it with AltStore, SideStore, Sideloadly, or TrollStore. The
            bundle declares the JIT and increased-memory entitlements; whether a
            signing path keeps them decides whether JIT is live, and Session
            reports the answer at runtime.
          files: LocalLLMSketch.ipa
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

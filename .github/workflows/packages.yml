name: Packages

# Manual only. Building a Swift package needs a macOS runner, which is billable
# on a private repository, so this does not fire on every push. Run it when you
# change Packages/VoiceAgentOrb.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-orb:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test VoiceAgentOrb
        run: swift test --package-path Packages/VoiceAgentOrb
